name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js
      - run: node --test tests/roles.test.cjs
